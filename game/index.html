<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1d1a24">
<meta name="mobile-web-app-capable" content="yes">
<title>Dustcrown</title>
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#1d1a24;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui{cursor:default}
#load{position:absolute;inset:0;z-index:5;background:#1d1a24;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#load img{image-rendering:pixelated;image-rendering:crisp-edges;max-width:86vw;height:auto}
#bar{width:min(420px,70vw);height:12px;margin:28px 0 14px;border:3px solid #e9d8a6;background:#2a2740;box-sizing:border-box}
#bar{overflow:hidden}#bar i{display:block;height:100%;width:100%;background:#f2b33d;box-shadow:inset 0 -3px 0 #c9772e;transform-origin:0 50%;transform:scaleX(0);will-change:transform}
#msg{height:30px}#err{color:#e9d8a6;font:14px monospace;margin-top:8px}
</style>
</head>
<body>
<div id="stage"><canvas id="world"></canvas><canvas id="ui"></canvas></div>
<div id="load"><img src="logo.png" alt="Dustcrown"><div id="bar"><i></i></div><div id="msg"><img id="msgi" alt=""></div><div id="err"></div></div>
<script>
// loading screen: the two scripts are loaded one after the other so that the page can paint and show progress (works from file://)
(function () {
  var fr = /^fr/i.test(navigator.language || ''); try { var o = JSON.parse(localStorage.getItem('aeonloom.options') || '{}'); if (o.lang) fr = o.lang === 'fr'; } catch (e) { }
  var bar = document.querySelector('#bar i'), msg = document.getElementById('msgi'), t0 = Date.now();
  // continuous bar (chantier C.5): each stage glides toward the next mark and slows as it nears it, on the compositor (transform), so it keeps moving while a script is parsed
  function go(v, secs) { bar.style.transition = 'transform ' + secs + 's cubic-bezier(.15,.6,.3,1)'; bar.style.transform = 'scaleX(' + v + ')'; }
  function step(i) { msg.src = 'load-' + (fr ? 'fr' : 'en') + '-' + i + '.png'; go([0.3, 0.68, 0.96][i], [1.6, 2.4, 6][i]); }
  function load(src, cb) { var s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = function () { document.getElementById('err').textContent = (fr ? 'Fichier manquant : ' : 'Missing file: ') + src; }; document.body.appendChild(s); }
  window.addEventListener('error', function (e) { var el = document.getElementById('err'); if (el) el.textContent = e.message || ''; });
  step(0);
  requestAnimationFrame(function () { setTimeout(function () { load('assets.js', function () { step(1); load('dustcrown.js', function () { step(2);
    var t = setInterval(function () { if (window.AL && AL.Game && AL.Game.ready) { clearInterval(t); go(1, 0.18); window.AL_LOAD_MS = Date.now() - t0; var l = document.getElementById('load'); l.style.transition = 'opacity .4s .2s'; l.style.opacity = 0; l.style.pointerEvents = 'none'; setTimeout(function () { l.remove(); }, 650); } }, 50); }); }); }, 30); });
})();
</script>
</body>
</html>
